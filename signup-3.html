<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>iGugulam - Student Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="auth-page">

    <a href="signup-2.html" class="back-btn">&lt; Back</a>

    <div class="auth-card">

        <h1>Student Details</h1>

        <div class="auth-field">
            <label for="studentName">Full Name:</label>
            <input type="text" id="studentName" placeholder="Full Name">
        </div>

        <div class="auth-field">
            <label for="studentGrade">Grade:</label>
            <input type="text" id="studentGrade" placeholder="ex. Grade 4">
        </div>

        <div class="auth-field">
            <label for="studentSubjects">Subject(s) needing support:</label>
            <input type="text" id="studentSubjects" placeholder="ex. Maths">
        </div>

        <div class="auth-field">
            <label for="studentEmergency">Emergency Contact:</label>
            <input type="tel" id="studentEmergency" placeholder="000 000 0000">
        </div>

        <button class="auth-btn" onclick="completeSignup()">Sign up</button>

        <button class="auth-btn-secondary" onclick="goBack('signup-2.html')">Back</button>

    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>

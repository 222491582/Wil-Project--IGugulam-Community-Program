<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iGugulam - Manage Study Resources</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <img class="logo" src="images/logo.png" alt="iGugulam Community Programme logo">
    <button class="logout" data-demo="Logout is ready to be connected to the Spring Boot authentication later.">Log out</button>
  </header>
  <div class="layout">
    <aside class="sidebar">
<nav class="nav">
  <a href="study-resources.html" class="active"><span class="nav-icon">⌂</span>Dashboard</a>
  <a href="manage-users.html" class=""><span class="nav-icon">♙</span>Manage Users</a>
  <a href="study-resources.html" class="active"><span class="nav-icon">▢</span>Study Resources</a>
  <a href="manage-homework.html" class=""><span class="nav-icon">▤</span>Homework</a>
  <a href="announcements.html" class=""><span class="nav-icon">⚑</span>Announcements</a>
  <a href="manage-contact-requests.html" class=""><span class="nav-icon">✉</span>Contact Requests</a>
  <a href="admin-profile.html" class=""><span class="nav-icon">♙</span>Profile</a>
  <div class="nav-divider"></div>
  <a href="#" data-demo="Logout is ready to be connected to the Spring Boot authentication later."><span class="nav-icon">↪</span>Logout</a>
</nav>
</aside>
    <main class="content">
<h1 style="font-size:22px;margin-bottom:18px;">Manage Study Resources <small style="float:right;font-size:13px;font-weight:400;">♟ Admin User ▾</small></h1>
<section class="panel">
  <div class="panel-header">
    <span>Resources List</span>
    <button class="add-btn" data-open-modal>+ Add Resource</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Resource Title</th><th>Subject</th><th>Action</th></tr></thead>
      <tbody>
        <tr data-search-row><td>Resource Title</td><td>Subject</td><td><button class="action-btn" data-demo="Edit resource">Edit</button></td></tr>
        <tr data-search-row><td>Resource Title</td><td>Subject</td><td><button class="action-btn danger" data-demo="Delete resource">Delete</button></td></tr>
        <tr data-search-row><td>Resource Title</td><td>Subject</td><td><button class="action-btn" data-demo="Edit resource">Edit</button></td></tr>
      </tbody>
    </table>
  </div>
</section>
<div class="modal-backdrop">
  <div class="modal">
    <button class="close-btn" data-close-modal>×</button>
    <h2>Add Resource</h2>
    <div class="field"><label>Resource Title</label><input placeholder="Resource Title"></div>
    <br>
    <div class="field"><label>Subject</label><input placeholder="Subject"></div>
    <br>
    <div class="field"><label>Description</label><textarea placeholder="Brief Description"></textarea></div>
    <br>
    <button class="add-btn" data-demo="Resource form submitted (prototype only)">Save Resource</button>
  </div>
</div>
</main>
  </div>
</div>
<script src="js/script.js"></script>
</body>
</html>

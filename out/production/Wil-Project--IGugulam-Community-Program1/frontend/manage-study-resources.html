    <main class="content">
<h1 style="font-size:22px;margin-bottom:18px;">Manage Study Resources <small style="float:right;font-size:13px;font-weight:400;">♟ Admin User ▾</small></h1>
<section class="panel">
  <div class="panel-header">
    <span>Resources List</span>
    <button class="add-btn" data-open-modal>+ Add Resource</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Resource Title</th><th>Subject</th><th>Action</th></tr></thead>
      <tbody id="adminResourcesTableBody"></tbody>
    </table>
  </div>
</section>
<div class="modal-backdrop">
  <div class="modal">
    <button class="close-btn" data-close-modal>×</button>
    <h2 id="adminResourceFormTitle">Add Resource</h2>
    <div class="field"><label>Resource Title</label><input id="adminResourceTitle" placeholder="Resource Title"></div>
    <br>
    <div class="field"><label>Subject</label><input id="adminResourceSubject" placeholder="Subject"></div>
    <br>
    <div class="field"><label>Description</label><textarea id="adminResourceDescription" placeholder="Brief Description"></textarea></div>
    <br>
    <div class="field"><label>Resource URL</label><input id="adminResourceUrl" type="url" placeholder="https://..."></div>
    <br>
    <button class="add-btn" onclick="saveManagedResource()">Save Resource</button>
  </div>
</div>
</main>
  </div>
</div>
<script src="js/script.js"></script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>iGugulam - Guardian Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="auth-page">

    <a href="signup-1.html" class="back-btn">&lt; Back</a>

    <div class="auth-card">

        <h1>Guardian Details</h1>

        <div class="auth-field">
            <label for="guardianName">Full Name:</label>
            <input type="text" id="guardianName" placeholder="Full Name">
        </div>

        <div class="auth-field">
            <label for="guardianEmail">Email:</label>
            <input type="email" id="guardianEmail" placeholder="example@gmail.com">
        </div>

        <div class="auth-field">
            <label for="guardianPhone">Phone Number:</label>
            <input type="tel" id="guardianPhone" placeholder="000 000 0000">
        </div>

        <div class="auth-field">
            <label for="guardianRelationship">Relationship with student:</label>
            <input type="text" id="guardianRelationship" placeholder="ex. Mother">
        </div>

        <button class="auth-btn" onclick="goToSignup3()">Next</button>

        <button class="auth-btn-secondary" onclick="goBack('signup-1.html')">Back</button>

    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>

# App
spring.application.name=IGugulam-Community-Program-Backend
server.port=8080

# Local development and automated test database. Use the mysql profile for persistent SQL storage.
spring.datasource.url=jdbc:h2:mem:igugulam
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:local-development-only-secret-key-change-this-value}
app.jwt.expiration-minutes=480
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>iGugulam - Administrator Log In</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- =========================
     PUBLIC NAVBAR
     ========================= -->

<header class="public-navbar">

    <div class="public-navbar-left">

        <button class="hamburger" aria-label="Menu">☰</button>

        <a href="login.html" class="public-logo">

            <div class="public-logo-icon">📖</div>

            <span>iGugulam Community Program</span>

        </a>

    </div>


    <div class="public-navbar-right">

        <a href="signup-1.html" class="nav-btn-outline">
            Sign up
        </a>

        <a href="login.html" class="nav-btn-solid">
            Log in
        </a>

    </div>

</header>


<!-- =========================
     LOGIN AREA
     ========================= -->

<div class="auth-page-bg">

    <div class="auth-card">

        <h1>Administrator log in</h1>

        <div class="auth-field">
            <label for="adminLoginUsername">Username:</label>
            <input type="text"
                   id="adminLoginUsername"
                   placeholder="Username">
        </div>

        <div class="auth-field">
            <label for="adminLoginPassword">Password:</label>
            <input type="password"
                   id="adminLoginPassword"
                   placeholder="********">
        </div>

        <button class="auth-btn" onclick="handleAdminLogin()">
            Log in
        </button>

    </div>

</div>


<script src="js/script.js"></script>

</body>
</html>

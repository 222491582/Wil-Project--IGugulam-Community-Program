<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>iGugulam - Student Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="auth-page">

    <a href="signup-2.html" class="back-btn">&lt; Back</a>

    <div class="auth-card">

        <h1>Student Details</h1>

        <div class="auth-field">
            <label for="studentName">Full Name:</label>
            <input type="text" id="studentName" placeholder="Full Name">
        </div>

        <div class="auth-field">
            <label for="studentGrade">Grade:</label>
            <select id="studentGrade" required>
                <option value="">Choose a grade</option>
                <option value="4">Grade 4</option><option value="5">Grade 5</option>
                <option value="6">Grade 6</option><option value="7">Grade 7</option>
                <option value="8">Grade 8</option><option value="9">Grade 9</option>
                <option value="10">Grade 10</option><option value="11">Grade 11</option>
                <option value="12">Grade 12</option>
            </select>
        </div>

        <fieldset class="subject-choice-fieldset">
            <legend>Choose subjects the learner needs help with</legend>
            <p class="subject-choice-hint">Select all that apply.</p>
            <div id="legacySignupSubjectChoices" class="subject-choice-list"></div>
        </fieldset>
        <p id="legacySignupSubjectsError" class="auth-error" role="alert"></p>

        <div class="auth-field">
            <label for="studentEmergency">Emergency Contact:</label>
            <input type="tel" id="studentEmergency" placeholder="000 000 0000">
        </div>

        <button class="auth-btn" onclick="completeSignup()">Sign up</button>

        <button class="auth-btn-secondary" onclick="goBack('signup-2.html')">Back</button>

    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>iGugulam - Student Log In</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="auth-page">

    <a href="index.html" class="back-btn">&lt; Back</a>

    <div class="auth-card">

        <div class="auth-logo">📖</div>

        <h1>Student log in</h1>

        <div class="auth-field">
            <label for="loginUsername">Username:</label>
            <input type="text" id="loginUsername" placeholder="Username">
        </div>

        <div class="auth-field">
            <label for="loginPassword">Password:</label>
            <input type="password" id="loginPassword" placeholder="********">
        </div>

        <button class="auth-btn" onclick="handleLogin()">Log in</button>

        <span class="auth-link">
            New here? <a href="family-portal.html">Log in or sign up</a>
        </span>
        <span class="auth-link">Student or guardian? <a href="family-portal.html">Open the shared portal</a></span>
        <p id="loginError" class="auth-error" role="alert"></p>

    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>
